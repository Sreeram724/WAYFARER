<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Portal Sign In — Wayfarer</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<div id="header-mount"></div>

<main class="container auth-shell" style="padding-top:70px;padding-bottom:80px;">
  <div class="auth-card" style="width:min(100%, 460px);border-top: 4px solid var(--teal);">
    <div class="eyebrow" style="color:var(--teal-dark);">Restricted Area</div>
    <h1 style="font-size:30px;margin-bottom:8px;">Admin Portal</h1>
    <p style="font-size:14px;color:var(--grey-text);margin-bottom:26px;">Sign in with your dedicated administrator credentials to access dashboard and manage bookings.</p>

    <form id="admin-login-form">
      <div class="field">
        <label for="admin-id">Admin Username / ID</label>
        <input type="text" id="admin-id" placeholder="Enter admin ID" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="admin-pw">Admin Password</label>
        <input type="password" id="admin-pw" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary auth-submit" id="admin-submit-btn" style="margin-top:6px;">Authorize & Sign In</button>
      <div class="form-msg" id="admin-login-msg" role="alert"></div>
    </form>

    <div style="margin-top:28px;padding-top:18px;border-top:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;font-size:13px;">
      <a href="login.html" class="link-teal">&larr; Return to Traveler Sign In</a>
      <span style="color:#9e9c94;">Wayfarer Security</span>
    </div>

    <div class="demo-credentials" style="margin-top:16px;">
      <strong>Default Admin Credentials:</strong>
      <span>Admin ID: <code>admin</code> / Password: <code>wayfarer123</code></span>
    </div>
  </div>
</main>

<div id="footer-mount"></div>

<script src="js/main.js"></script>
<script src="js/admin-login.js"></script>
</body>
</html>
