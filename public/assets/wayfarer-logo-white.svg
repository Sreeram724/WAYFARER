<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 56" role="img" aria-label="Wayfarer Luxury Travel">
  <defs>
    <linearGradient id="wfEmeraldGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="wfGoldGradW" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="wfRingGradW" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0.8"/>
    </linearGradient>
  </defs>

  <!-- Brand Emblem / Compass Star (Dark BG) -->
  <g transform="translate(6, 6)">
    <!-- Outer Precision Ring -->
    <circle cx="22" cy="22" r="21" fill="rgba(255,255,255,0.06)" stroke="url(#wfRingGradW)" stroke-width="1.5"/>
    <circle cx="22" cy="22" r="17.5" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="0.75" stroke-dasharray="2 3"/>

    <!-- Cardinal Marks -->
    <path d="M22 2v4M22 38v4M2 22h4M38 22h4" stroke="#fbbf24" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Compass 8-Point Star Facets -->
    <polygon points="22,6 25,22 22,20" fill="url(#wfGoldGradW)"/>
    <polygon points="22,6 19,22 22,20" fill="#b45309"/>
    <polygon points="22,38 25,22 22,24" fill="#047857"/>
    <polygon points="22,38 19,22 22,24" fill="url(#wfEmeraldGradW)"/>
    <polygon points="38,22 22,25 24,22" fill="#b45309"/>
    <polygon points="38,22 22,19 24,22" fill="url(#wfGoldGradW)"/>
    <polygon points="6,22 22,25 20,22" fill="url(#wfEmeraldGradW)"/>
    <polygon points="6,22 22,19 20,22" fill="#047857"/>

    <polygon points="33,11 22,22 25,20" fill="#34d399" opacity="0.85"/>
    <polygon points="11,33 22,22 19,24" fill="#34d399" opacity="0.85"/>
    <polygon points="33,33 22,22 24,25" fill="#fbbf24" opacity="0.85"/>
    <polygon points="11,11 22,22 20,19" fill="#fbbf24" opacity="0.85"/>

    <circle cx="22" cy="22" r="3.2" fill="#ffffff" stroke="url(#wfGoldGradW)" stroke-width="1.2"/>
    <circle cx="22" cy="22" r="1.2" fill="#059669"/>
  </g>

  <!-- White Luxury Typography -->
  <text x="64" y="32" font-family="'Playfair Display', Georgia, serif" font-size="24" font-weight="700" letter-spacing="0.14em" fill="#ffffff">WAYFARER</text>
  <text x="65" y="44" font-family="'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="700" letter-spacing="0.32em" fill="#34d399">BESPOKE JOURNEYS &#8226; INDIA</text>
</svg>
