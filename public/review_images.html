<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Package Image Visual Audit</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; padding: 24px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
    .card { background: #1e293b; border-radius: 12px; overflow: hidden; border: 1px solid #334155; }
    .card img { width: 100%; height: 200px; object-fit: cover; }
    .content { padding: 16px; }
    .title { font-size: 16px; font-weight: 700; color: #38bdf8; margin-bottom: 6px; }
    .dest { font-size: 13px; color: #fbbf24; font-weight: 600; margin-bottom: 8px; }
    .highlights { font-size: 12px; color: #94a3b8; line-height: 1.4; margin-bottom: 8px; }
    .url { font-size: 10px; color: #64748b; word-break: break-all; }
  </style>
</head>
<body>
  <h1>Package Image Verification Audit</h1>
  <div class="grid" id="pkg-grid"></div>

  <script>
    fetch('/api/packages')
      .then(res => res.json())
      .then(pkgs => {
        const grid = document.getElementById('pkg-grid');
        grid.innerHTML = pkgs.map(p => `
          <div class="card" id="pkg-card-${p.id}">
            <img src="${p.image_url}" alt="${p.name}">
            <div class="content">
              <div class="title">[${p.id}] ${p.name}</div>
              <div class="dest">📍 ${p.destination_name} (${p.region}) · ${p.category}</div>
              <div class="highlights"><strong>Highlights:</strong> ${p.highlights || 'None'}</div>
              <div class="url">${p.image_url}</div>
            </div>
          </div>
        `).join('');
      });
  </script>
</body>
</html>
